<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>
  <div class="wrapper">
    <p>{{ site.title | escape }} &middot; {{ site.description | escape }}</p>
    <p class="footer-links">
      {%- if site.email -%}<a class="u-email" href="mailto:{{ site.email }}">Email</a>{%- endif -%}
      <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
      {%- if site.github_username -%}<a href="https://github.com/{{ site.github_username }}/range-of-light">Source</a>{%- endif -%}
    </p>
  </div>
</footer>
