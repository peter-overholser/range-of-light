<!-- Render ```mermaid fenced code blocks as diagrams. Mermaid is only loaded on pages that have one. -->
<script type="module">
  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  if (blocks.length) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
    blocks.forEach((block) => {
      const target = block.tagName === "CODE" ? block.parentElement : block;
      const diagram = document.createElement("pre");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent;
      target.replaceWith(diagram);
    });
    const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", fontFamily: "Inter, sans-serif" });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
